[package]
name = "self-referential"
version = "0.1.0"
edition = "2024"
default-run = "self-referential"

[dependencies]
bitvec = "1.0.1"
heapless = "0.9.2"
hotpath = "0.10"
rayon = "1"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
